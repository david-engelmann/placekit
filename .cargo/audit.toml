# Advisory dispositions for cargo audit. PyO3 0.29 carries the
# fixes for the three advisories that stood against the locked
# PyO3 0.23.5 (RUSTSEC-2025-0020, RUSTSEC-2026-0177, and the
# PyList and PyTuple iterator read fixed in 0.29.0), so no
# advisory is ignored here. An ignore entry may return only
# with a reach statement verified against the workspace
# sources and every other consumer of the dependency in the
# lock, written out in this file beside the entry. Any
# advisory not named here still fails the audit.

[advisories]
ignore = []
