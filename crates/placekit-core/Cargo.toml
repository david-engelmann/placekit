[package]
name = "placekit-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Rust core for placekit, a Google Places API (New) client"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
url = "2"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }
