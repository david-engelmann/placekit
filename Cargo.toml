[package]
name = "placekit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Modern Google Places API (New) client for Python, powered by a Rust core"
readme = "README.md"
exclude = [".github/*"]
keywords = ["google-places", "places", "pyo3", "maps"]
categories = ["api-bindings"]

[lib]
name = "_placekit"
crate-type = ["cdylib"]

[workspace]
members = ["crates/placekit-core"]
resolver = "2"

[dependencies]
placekit-core = { path = "crates/placekit-core" }
futures-util = "0.3"
serde = "1"
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
pythonize = "0.23"
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
