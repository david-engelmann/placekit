# Runs the repo gate: `make check`, word for word the same command a
# developer runs locally. CI is a backstop, not a second definition of
# done.
#
# All third party actions are pinned to commit SHAs, with the version
# each SHA resolves recorded in a trailing comment. Dependabot
# (.github/dependabot.yml) proposes updates to the pins weekly.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Create the dev venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Run the gate
        run: make check
